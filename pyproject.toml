[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-tts"
version = "0.1.0"
description = "A local-first Russian and English audiobook workshop"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "defusedxml>=0.7,<1",
  "beautifulsoup4>=4.13,<5",
  "pillow>=11,<13",
  "numpy>=2,<3",
  "soundfile>=0.13,<1",
  "num2words>=0.5.14,<1",
  "python-dotenv>=1,<2",
  "pypdf>=6,<8",
  "cmudict>=1,<2",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4.9,<0.5"]
dev = [
    "pytest>=8,<10",
    "reportlab>=4,<5",
    "ruff>=0.12,<1",
]

[project.scripts]
book-tts = "book_tts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["book_tts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

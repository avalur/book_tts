<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Book TTS{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar"><a href="/" class="brand"><span class="brand-mark">b<span>∿</span></span>book<span class="brand-light">tts</span></a><span class="top-caption">Личная мастерская аудиокниг</span><span class="local-badge"><i></i> На вашем компьютере</span></header>
  <main>{% block content %}{% endblock %}</main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <footer><span>Book TTS · своя книга, свой темп</span><a href="/docs" target="_blank" rel="noopener">API</a></footer>
</body>
</html>
